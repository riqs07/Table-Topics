# Run every quality check on each push and pull request
name: CI

# Start the checks whenever code is pushed or a pull request is opened or updated
on:
  push:
  pull_request:

# Give the workflow read-only access to the repository
permissions:
  contents: read

jobs:
  # One job that runs all checks in order
  check:
    # Use a fresh Linux machine provided by GitHub
    runs-on: ubuntu-latest
    steps:
      # Download the repository code
      - uses: actions/checkout@v5
      # Install pnpm using the version pinned in package.json
      - uses: pnpm/action-setup@v4
      # Install Node.js from .nvmrc and cache downloaded packages
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Install exactly the versions recorded in the lockfile
      - run: pnpm install --frozen-lockfile
      # Refuse known high or critical flaws in the packages the released app ships (decision 123 asks for this check before each release)
      - run: pnpm audit --prod --audit-level=high
      # Check code style and common mistakes, failing on any warning
      - run: pnpm lint
      # Check that all types are correct
      - run: pnpm typecheck
      # Run the automated tests
      - run: pnpm test
      # Confirm the app builds for production
      - run: pnpm build
      # Install the browser the browser checks use
      - run: pnpm exec playwright install --with-deps chromium
      # Run the browser checks against the production build (playbook rule T10)
      - run: pnpm e2e
      # Keep the traces of failed browser checks for debugging
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-traces
          path: test-results/
          retention-days: 7

  # The voice worker's own tests (decision 91), on synthetic voices; the optional audEERING test is skipped
  voice-worker:
    # Use a fresh Linux machine provided by GitHub
    runs-on: ubuntu-latest
    # Run inside the worker's folder
    defaults:
      run:
        working-directory: voice-worker
    steps:
      # Download the repository code
      - uses: actions/checkout@v5
      # Install the Python the worker's image uses
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # ffmpeg reads the recordings
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Install the worker's packages and pytest
      - run: pip install -r requirements-dev.txt
      # Run the tests
      - run: pytest
