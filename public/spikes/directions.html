<!doctype html>
<!-- Design spike: the Home screen in three visual directions, to choose one before redoing the wireframes (C11). -->
<!-- Throwaway: deleted once a direction is chosen; the choice is recorded in documents/design/design-system.md. -->
<html lang="en">
<head>
  <!-- Read the page as Unicode text -->
  <meta charset="utf-8">
  <!-- Fit the page to the screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tab title -->
  <title>VoiceLab: three directions</title>
  <!-- Fonts for the three directions (a spike may load them directly; the real app self-hosts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Allow font files from Google's font server -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Newsreader (editorial), Archivo Narrow + Courier Prime (recorder), IBM Plex Mono (instrument) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    /* Shared palette: Calm studio with the forest green accent chosen at C6 */
    :root { --stone: #f3f4f2; --paper: #fcfcfb; --ink: #1e2320; --muted: #59615c; --rule: #d4d9d5; --forest: #2d5a3d; --forest-ink: #fcfcfb; }
    /* Page background and default text */
    body { margin: 0; background: #e6e8e4; color: var(--ink); font-family: system-ui, sans-serif; }
    /* Page header */
    header { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; }
    /* Page title */
    header h1 { font: 500 28px/1.2 system-ui, sans-serif; margin: 0; }
    /* Page explanation */
    header p { color: var(--muted); max-width: 60ch; }
    /* Row of the three phones, wrapping on small screens */
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; padding: 24px 16px 64px; }
    /* One phone and its caption */
    figure { margin: 0; width: 360px; max-width: 100%; }
    /* The phone screen */
    .phone { box-sizing: border-box; height: 740px; border-radius: 36px; overflow: hidden; position: relative; box-shadow: 0 0 0 10px #1b1d1c; }
    /* Caption under each phone */
    figcaption { margin-top: 26px; font-size: 15px; }
    /* Caption title */
    figcaption b { display: block; font-size: 18px; margin-bottom: 4px; }
    /* Caption explanation */
    figcaption span { color: var(--muted); }

    /* ---------- A. Editorial: a printed speech script ---------- */
    /* Paper background and serif type */
    .ed { background: var(--paper); font-family: "Newsreader", Georgia, serif; padding: 26px 26px 0; display: flex; flex-direction: column; }
    /* Masthead line: name left, date right */
    .ed .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
    /* App name in small capitals */
    .ed .name { font-variant: small-caps; letter-spacing: .04em; font-size: 19px; }
    /* Date and links in italic */
    .ed .date { font-style: italic; color: var(--muted); font-size: 15px; }
    /* Running line about the streak and focus, like a standfirst */
    .ed .stand { font-size: 17px; line-height: 1.45; margin: 18px 0 0; color: var(--muted); }
    /* Emphasis inside the standfirst */
    .ed .stand em { color: var(--ink); }
    /* The prompt, set like a headline with a hanging quote mark */
    .ed .prompt { position: relative; font-size: 44px; line-height: 1.04; font-weight: 400; letter-spacing: -.01em; margin: 34px 0 0; }
    /* The hanging opening quote in forest green */
    .ed .prompt::before { content: "\201C"; position: absolute; left: -.42em; top: -.08em; color: var(--forest); }
    /* Small italic note to swap the prompt */
    .ed .swap { font-style: italic; color: var(--muted); font-size: 15px; margin-top: 14px; }
    /* Space filler that pushes the footer down */
    .ed .grow { flex: 1; }
    /* Footnote for the weekly challenge */
    .ed .foot { font-size: 15px; line-height: 1.4; border-top: 1px solid var(--rule); padding: 12px 0; display: flex; gap: 10px; align-items: flex-start; }
    /* Square checkbox for the challenge */
    .ed .box { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--ink); margin-top: 3px; }
    /* Full-width square-cornered action band at the bottom */
    .ed .act { margin: 0 -26px; background: var(--forest); color: var(--forest-ink); padding: 22px 26px 30px; display: flex; justify-content: space-between; align-items: baseline; }
    /* Action text in large italic serif, kept on one line */
    .ed .act b { font-weight: 400; font-style: italic; font-size: 28px; white-space: nowrap; }
    /* Reassurance on the right, kept on one line */
    .ed .act span { font-size: 14px; opacity: .85; white-space: nowrap; }

    /* ---------- B. Recorder: a pocket tape recorder ---------- */
    /* Device body: warm grey plastic, condensed labels */
    .rec { background: #cfd2cc; font-family: "Archivo Narrow", sans-serif; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
    /* Top strip: brand and tape counter */
    .rec .top { display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: 13px; color: #3b403c; }
    /* Tape counter digits in a dark window */
    .rec .counter { font-family: "IBM Plex Mono", monospace; background: #1b1d1c; color: #e9ece8; padding: 3px 8px; border-radius: 3px; letter-spacing: .2em; }
    /* Cassette label: paper with ruled lines */
    .rec .label { background: var(--paper); border-radius: 6px; padding: 12px 16px 14px; box-shadow: inset 0 0 0 1px #b9bdb7; background-image: repeating-linear-gradient(transparent 0 27px, #dfe3df 27px 28px); }
    /* Small heading on the label */
    .rec .side { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--forest); font-weight: 700; }
    /* The prompt, typed on the label */
    .rec .typed { font-family: "Courier Prime", monospace; font-size: 20px; line-height: 28px; margin-top: 2px; }
    /* Focus selector styled like a hardware slide switch */
    .rec .switch { display: grid; grid-template-columns: repeat(4, 1fr); background: #b9bdb7; border-radius: 6px; padding: 3px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; text-align: center; }
    /* One switch position */
    .rec .switch span { padding: 8px 0; color: #4a504b; }
    /* The current focus position */
    .rec .switch .on { background: var(--paper); border-radius: 4px; color: var(--ink); box-shadow: 0 1px 0 #8e938c; }
    /* Level meter: a row of bars */
    .rec .meter { display: flex; gap: 4px; align-items: flex-end; height: 40px; padding: 0 4px; }
    /* One bar of the level meter */
    .rec .meter i { flex: 1; background: #9ea39c; border-radius: 1px; }
    /* Lit bars in forest green */
    .rec .meter i.lit { background: var(--forest); }
    /* Area that centers the record button */
    .rec .deck { flex: 1; display: grid; place-items: center; }
    /* The big round record button with a raised rim */
    .rec .btn { width: 148px; height: 148px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3a7150, var(--forest) 60%); box-shadow: 0 0 0 10px #b9bdb7, 0 0 0 11px #a3a8a1, 0 8px 0 10px #9ea39c; display: grid; place-items: center; color: var(--forest-ink); font-weight: 700; letter-spacing: .2em; font-size: 20px; }
    /* Masking-tape note for the weekly challenge */
    .rec .tape { background: #ecdfae; transform: rotate(-1.2deg); padding: 9px 14px; font-family: "Courier Prime", monospace; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

    /* ---------- C. Instrument: a plain monospaced tool ---------- */
    /* Off-white background, monospace everything */
    .ins { background: var(--stone); font-family: "IBM Plex Mono", monospace; font-size: 14px; padding: 24px 22px; display: flex; flex-direction: column; }
    /* Header line */
    .ins .hd { display: flex; justify-content: space-between; font-weight: 600; letter-spacing: .06em; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
    /* Table of status lines */
    .ins table { border-collapse: collapse; margin: 12px 0 0; width: 100%; }
    /* Status line cells */
    .ins td { padding: 5px 0; vertical-align: top; }
    /* Status line names */
    .ins td:first-child { color: var(--muted); width: 72px; }
    /* Forest marker for the current focus */
    .ins .mark { color: var(--forest); font-weight: 600; }
    /* Divider */
    .ins hr { border: 0; border-top: 1px solid var(--ink); margin: 14px 0 0; }
    /* Prompt number */
    .ins .num { color: var(--muted); margin-top: 22px; }
    /* The prompt, large monospace */
    .ins .prompt { font-size: 27px; line-height: 1.22; font-weight: 500; margin-top: 6px; letter-spacing: -.02em; }
    /* Space filler that pushes the action down */
    .ins .grow { flex: 1; }
    /* Hard-edged record block */
    .ins .act { background: var(--forest); color: var(--forest-ink); display: flex; justify-content: space-between; padding: 18px 16px; font-weight: 600; font-size: 17px; letter-spacing: .04em; }
    /* Challenge line */
    .ins .wk { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 12px; }
  </style>
</head>
<body>
  <!-- Explanation -->
  <header>
    <!-- Title -->
    <h1>Home screen, three ways</h1>
    <!-- How to compare -->
    <p>Same content, same forest green. Only the design language changes. Pick one (or mix: say which parts you like) and I will redo all five wireframes in it.</p>
  </header>

  <!-- The three phones -->
  <div class="row">

    <!-- A. Editorial -->
    <figure>
      <!-- Phone screen -->
      <div class="phone ed">
        <!-- Masthead -->
        <div class="mast"><span class="name">VoiceLab</span><span class="date">Tuesday · History · Settings</span></div>
        <!-- Streak and focus, written as a sentence -->
        <p class="stand">Fourth day running. This week: <em>drop the ums</em> and let a pause do the work.</p>
        <!-- The prompt -->
        <h2 class="prompt">Describe a small thing that made your week better.</h2>
        <!-- Swap the prompt -->
        <p class="swap">or choose another</p>
        <!-- Push the footer down -->
        <div class="grow"></div>
        <!-- Weekly challenge as a footnote -->
        <div class="foot"><span class="box"></span><span>Off the page this week: ask one question in a meeting.</span></div>
        <!-- Action band -->
        <div class="act"><b>Speak for a minute</b><span>just you</span></div>
      </div>
      <!-- Caption -->
      <figcaption><b>A. Script page</b><span>Like a printed speech or a magazine page. Big serif prompt, prose instead of widgets, square edges.</span></figcaption>
    </figure>

    <!-- B. Recorder -->
    <figure>
      <!-- Phone screen -->
      <div class="phone rec">
        <!-- Brand and counter -->
        <div class="top"><span>VoiceLab · Side A</span><span class="counter">014</span></div>
        <!-- Cassette label with the prompt -->
        <div class="label"><div class="side">Today · day 4</div><div class="typed">Describe a small thing that made your week better.</div></div>
        <!-- Focus as a slide switch -->
        <div class="switch"><span>Finish</span><span class="on">Fillers</span><span>Pace</span><span>Point</span></div>
        <!-- Level meter -->
        <div class="meter"><i class="lit" style="height:30%"></i><i class="lit" style="height:55%"></i><i class="lit" style="height:40%"></i><i class="lit" style="height:70%"></i><i style="height:45%"></i><i style="height:25%"></i><i style="height:60%"></i><i style="height:35%"></i><i style="height:20%"></i><i style="height:50%"></i><i style="height:30%"></i><i style="height:15%"></i></div>
        <!-- Record button -->
        <div class="deck"><div class="btn">REC</div></div>
        <!-- Weekly challenge on a piece of tape -->
        <div class="tape">this week: ask one question in a meeting ☐</div>
      </div>
      <!-- Caption -->
      <figcaption><b>B. Tape recorder</b><span>The phone as a physical recorder. Tactile record button, level meter, cassette label, tape notes.</span></figcaption>
    </figure>

    <!-- C. Instrument -->
    <figure>
      <!-- Phone screen -->
      <div class="phone ins">
        <!-- Header -->
        <div class="hd"><span>VOICELAB</span><span>13.10</span></div>
        <!-- Status lines -->
        <table>
          <!-- Streak -->
          <tr><td>streak</td><td>4 days</td></tr>
          <!-- Focus -->
          <tr><td>focus</td><td><span class="mark">2/4</span> fillers, use pauses</td></tr>
          <!-- Progress against baseline -->
          <tr><td>fillers</td><td>6.0/min at start, 3.1 last</td></tr>
        </table>
        <!-- Divider -->
        <hr>
        <!-- Prompt number -->
        <div class="num">prompt 017</div>
        <!-- The prompt -->
        <div class="prompt">Describe a small thing that made your week better.</div>
        <!-- Push the action down -->
        <div class="grow"></div>
        <!-- Record block -->
        <div class="act"><span>● RECORD</span><span>~1:00</span></div>
        <!-- Weekly challenge -->
        <div class="wk"><span>week: ask one question in a meeting</span><span style="white-space:nowrap">[ ]</span></div>
      </div>
      <!-- Caption -->
      <figcaption><b>C. Instrument</b><span>A plain, honest tool. Monospace, hard edges, numbers up front, no decoration or cheerleading.</span></figcaption>
    </figure>

  </div>
</body>
</html>
