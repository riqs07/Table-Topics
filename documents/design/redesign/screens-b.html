<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>VoiceLab Playful Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: a header with a light/dark switch, then a wrapping row of phones, each with a caption saying what the screen is for. */
:root{--bg:#eceee9;--surface:#f8f9f6;--fg:#1c201d;--muted:#5d655f;--line:#d3d8d1;--chip:#dfe3dc;--frame:#1c201d;--focus:#2c8050;--ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121513;--surface:#1a1e1b;--fg:#e6eae7;--muted:#9aa39d;--line:#2c322e;--chip:#252b27;--frame:#000;--focus:#6fd39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121513;--surface:#1a1e1b;--fg:#e6eae7;--muted:#9aa39d;--line:#2c322e;--chip:#252b27;--frame:#000;--focus:#6fd39a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45}
.wrap{max-width:1640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:6px 0 0;max-width:70ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;color:var(--fg);border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button:focus-visible,.p button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.phones{display:flex;gap:28px 24px;flex-wrap:wrap;justify-content:center}
.pcol{display:flex;flex-direction:column;gap:10px;width:min(360px,100%);flex:none;min-width:0}
.cap h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px;margin:0}
.cap{min-height:88px}.cap p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* phone shell + B tokens */
.p{width:100%;height:740px;border-radius:44px;border:10px solid var(--frame);overflow:hidden;position:relative;background:var(--p-bg);color:var(--p-ink);box-shadow:0 20px 50px rgba(0,0,0,.18);font-family:"Nunito",system-ui,sans-serif}
.p[data-m="light"]{--p-bg:#fff7ef;--p-card:#ffffff;--p-ink:#2b2320;--p-muted:#7a6c64;--p-line:#f0e2d6;--p-tabbg:#ffffff;--p-accent:#3fa66b;--p-accent-d:#2c8050;--p-on-accent:#ffffff;--blob:#e8935c;--blob-shade:#cf7440;--blob-ink:#2a2420;--hl:#fff6e6;--sky:#4a68e0;--sun:#f4b73b;--bloom:#e86aae;--leaf:#7cc46a;--plum:#8a63e0;--coral:#ec6a55;--bubble:#ffffff;--soft:#fbeee2;--green-soft:#e4f5e8;--green-ink:#22704a;--amber:#f4b73b;--path-off:#eadbcd;--path-off-d:#d8c4b2}
.p[data-m="dark"]{--p-bg:#1d1916;--p-card:#2a2420;--p-ink:#fbefe4;--p-muted:#b9a99d;--p-line:#3a312b;--p-tabbg:#231e1a;--p-accent:#4cbf7c;--p-accent-d:#2f8a56;--p-on-accent:#0f1f15;--blob:#e8935c;--blob-shade:#c46a38;--blob-ink:#1d1a17;--hl:#fff6e6;--sky:#3f5bc9;--sun:#e0a530;--bloom:#d45c9d;--leaf:#66ad57;--plum:#7656cc;--coral:#d85c48;--bubble:#2f2823;--soft:#2f2823;--green-soft:#1f3a2a;--green-ink:#9be0b4;--amber:#e0a530;--path-off:#3a312b;--path-off-d:#2a231e}
.p .scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.p .scr::-webkit-scrollbar{display:none}
.p svg{display:block}
.p button{font:inherit;cursor:pointer;color:inherit}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:800;opacity:.8}
.round{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
.pad{padding:2px 18px 104px;display:flex;flex-direction:column;gap:16px}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h h3{margin:0;font-size:28px;line-height:1}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-6px}
.sec h4{margin:0;font-size:19px}
.sec a{color:var(--p-accent);font-weight:800;font-size:14px;text-decoration:none}
.lab{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p-muted)}
.card{background:var(--p-card);border:2px solid var(--p-line);border-radius:22px;box-shadow:0 4px 0 var(--p-line)}
.chunky{border:0;border-radius:16px;padding:14px;width:100%;background:var(--p-accent);color:var(--p-on-accent)!important;font-family:"Fredoka",sans-serif;font-weight:600;font-size:17px;letter-spacing:.03em;box-shadow:0 5px 0 var(--p-accent-d);text-transform:uppercase}
.chunky.sm{width:auto;padding:9px 16px;font-size:14px;border-radius:12px;box-shadow:0 4px 0 var(--p-accent-d)}
.chunky:active{transform:translateY(3px);box-shadow:0 2px 0 var(--p-accent-d)}
.bubble{background:var(--bubble);border:2px solid var(--p-line);border-radius:18px;padding:9px 13px;font-weight:700;font-size:14.5px;position:relative;flex:1}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--bubble);border-left:2px solid var(--p-line);border-bottom:2px solid var(--p-line);transform:rotate(45deg)}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px 16px;background:var(--p-tabbg);border-top:2px solid var(--p-line);z-index:3}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--p-muted);font-weight:800;min-width:64px}
.tabs div.on{color:var(--p-accent)}
.tabs div.on i{background:var(--green-soft);border-radius:10px}
.tabs i{width:40px;height:28px;display:grid;place-items:center}
.bob{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.8);opacity:.7}to{transform:scale(1.35);opacity:0}}
.lvl{animation:lvl .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes lvl{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.ring,.lvl{animation:none!important}}

/* Practice */
.quick{display:flex;gap:12px;align-items:center;padding:12px;background:var(--sky);border-color:transparent;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 70%,#000);color:#fff}
.quick .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.quick .lab{color:#ffffffcc}
.quick .t{font-size:19px;line-height:1.15}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.job{padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.job .art{border-radius:16px;height:96px;display:grid;place-items:center;overflow:hidden}
.job b{font-size:16px;line-height:1.15}
.job small{color:var(--p-muted);font-weight:700;font-size:12px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pack{flex:none;width:150px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pack .art{height:84px;border-radius:14px;display:grid;place-items:center}
.pack b{font-size:14.5px;line-height:1.15}
.pack small{font-size:12px;color:var(--p-muted);font-weight:700}
.challenge{display:flex;gap:12px;align-items:center;padding:14px;background:var(--soft);border-color:var(--p-line)}
.check{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--p-muted);flex:none}

/* Courses */
.cont{padding:12px;display:flex;flex-direction:column;gap:10px}
.cont .row{display:flex;gap:12px;align-items:center}
.pbar{height:12px;border-radius:999px;background:var(--p-line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--p-accent);border-radius:999px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctile{padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ctile b{font-size:15px;line-height:1.15}
.ctile small{font-size:12px;color:var(--p-muted);font-weight:700}
.reads{display:flex;flex-direction:column;gap:8px}
.read{display:flex;gap:12px;align-items:center;padding:10px 12px}
.read .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.read b{display:block;font-size:15px}
.read small{color:var(--p-muted);font-weight:700;font-size:12px}

/* Course path */
.band{margin:0 14px;border-radius:20px;padding:12px 14px;background:var(--sky);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.band .lab{color:#ffffffcc}
.band b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px;display:block;line-height:1.15}
.band .guide{width:42px;height:42px;border-radius:12px;background:#ffffff33;display:grid;place-items:center;flex:none}
.path{position:relative;height:640px;margin-top:8px}
.node{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%)}
.node .disc{width:68px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff}
.node.done .disc{background:var(--p-accent);box-shadow:0 6px 0 var(--p-accent-d)}
.node.now .disc{background:var(--sun);box-shadow:0 6px 0 color-mix(in srgb,var(--sun) 70%,#000);color:#3a2a08}
.node.next .disc{background:var(--path-off);box-shadow:0 6px 0 var(--path-off-d);color:var(--p-muted)}
.node .nm{font-size:12px;font-weight:800;text-align:center;line-height:1.15;width:110px}
.node.next .nm{color:var(--p-muted)}
.node.now::before{content:"";position:absolute;top:-8px;width:88px;height:82px;border-radius:50%;border:5px solid color-mix(in srgb,var(--sun) 40%,transparent)}
.startpop{position:absolute;background:var(--p-card);border:2px solid var(--p-line);border-radius:14px;padding:6px 12px;font-family:"Fredoka",sans-serif;font-weight:600;color:var(--sun);font-size:15px;box-shadow:0 3px 0 var(--p-line);transform:translateX(-50%)}
.startpop::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--p-card);border-right:2px solid var(--p-line);border-bottom:2px solid var(--p-line);transform:translateX(-50%) rotate(45deg)}

/* Recording */
.rtop{display:flex;align-items:center;gap:12px;padding:6px 18px}
.rtop .x{font-size:22px;color:var(--p-muted);background:none;border:0;padding:0 4px}
.rtop .pbar{flex:1;height:14px}
.rq{padding:6px 20px 0;display:flex;flex-direction:column;gap:6px}
.rq h2{margin:0;font-size:22px;line-height:1.15}
.listen{display:grid;place-items:center;margin-top:8px;position:relative;height:230px}
.listen svg.rings{position:absolute}
.clock{display:flex;justify-content:center;gap:8px;align-items:center}
.clock b{font-family:"Fredoka",sans-serif;font-size:34px;font-variant-numeric:tabular-nums}
.light{display:flex;gap:6px;align-items:center;background:var(--p-card);border:2px solid var(--p-line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:800;color:var(--p-muted)}
.light i{width:12px;height:12px;border-radius:50%;background:var(--p-line)}
.light i.g{background:var(--p-accent)}
.live{margin:10px 20px 0;padding:12px 14px;font-size:15px;line-height:1.5;color:var(--p-muted);min-height:96px}
.live strong{color:var(--p-ink);font-weight:700}
.cuechip{align-self:center;margin:12px auto 0;background:var(--green-soft);color:var(--green-ink);font-weight:800;font-size:13.5px;padding:7px 14px;border-radius:999px;display:table}
.stopdock{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.stop{width:78px;height:78px;border-radius:50%;border:0;background:var(--p-ink);display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--p-ink) 60%,#000)}
.stop span{width:26px;height:26px;border-radius:7px;background:var(--p-bg)}
.side{font-weight:800;font-size:13px;color:var(--p-muted);background:none;border:0;width:90px}

/* Me */
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:24px;display:block;line-height:1.05}
.who small{color:var(--p-muted);font-weight:700}
.tn{padding:14px;display:flex;flex-direction:column;gap:10px}
.tn .cols{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.tn .col{background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.tn .col.now{background:var(--green-soft)}
.tn .col b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:28px;line-height:1}
.tn .col small{font-size:12px;font-weight:700;color:var(--p-muted)}
.tn .col.now b{color:var(--green-ink)}
.playrow{display:flex;gap:8px}
.playbtn{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;border:2px solid var(--p-line);background:var(--p-card);border-radius:14px;padding:9px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 var(--p-line)}
.playbtn i{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px;display:flex;gap:10px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.stat b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:22px;display:block;line-height:1}
.stat small{font-size:11.5px;font-weight:700;color:var(--p-muted)}
.days{display:flex;gap:6px;padding:12px 14px;justify-content:space-between;align-items:center}
.days span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--p-muted)}
.days b{width:26px;height:26px;border-radius:9px;background:var(--p-line);display:grid;place-items:center;color:var(--p-on-accent);font-size:13px}
.days .d b{background:var(--p-accent)}
.settings{display:flex;flex-direction:column}
.set{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:2px solid var(--p-line);font-weight:700}
.set:first-child{border-top:0}
.set span{margin-left:auto;color:var(--p-muted);font-size:13px;font-weight:700}
.set em{font-style:normal;color:var(--p-muted)}
</style>

<div class="wrap">
  <header>
    <h1>VoiceLab, direction B: the other screens</h1>
    <p class="lede">Practice, Courses, a course’s lesson path, the recording screen, and Me, all in the Playful style you picked. Real VoiceLab content throughout. Each phone scrolls. Switch light and dark below.</p>
  </header>
  <div class="bar"><span style="font-size:13px;color:var(--muted)">Phones</span>
    <div class="seg" role="group" aria-label="Phone theme" id="modes"><button type="button" data-m="light">Light</button><button type="button" data-m="dark">Dark</button></div>
  </div>
  <div class="phones" id="phones"></div>
</div>

<script>
(() => {
  const BLOB = "M0 -100C58.8 -100 106 -53.2 106 0C106 50.4 61.6 94 0 94C-58.8 94 -103 53.2 -103 0C-103 -56 -56 -100 0 -100Z";
  const FACES = {
    ready: `<ellipse class="blink" fill="currentColor" cx="12" cy="10" rx="5" ry="7.5"/><ellipse class="blink" fill="currentColor" cx="36" cy="10" rx="5" ry="7.5"/><path stroke="currentColor" fill="none" d="M16 26q8 7 16 0"/>`,
    happy: `<path stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M5 13l7-7 7 7M29 13l7-7 7 7"/><path fill="currentColor" d="M12 22h24q0 12-12 12t-12-12z"/>`,
    wonder: `<circle fill="currentColor" cx="16" cy="6" r="5"/><circle fill="currentColor" cx="40" cy="6" r="5"/><path stroke="currentColor" fill="none" stroke-linecap="round" d="M16 26q8 6 16 0"/>`,
    sing: `<path stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M5 13l7-7 7 7M29 13l7-7 7 7"/><ellipse fill="currentColor" cx="24" cy="27" rx="7" ry="7"/>`,
    wow: `<circle fill="currentColor" cx="12" cy="9" r="6"/><circle fill="currentColor" cx="36" cy="9" r="6"/><ellipse fill="currentColor" cx="24" cy="28" rx="4.5" ry="5.5"/>`
  };
  const body = (face, alt) => `<path fill="${alt ? "color-mix(in srgb,var(--p-accent) 75%,#000)" : "var(--blob-shade)"}" d="${BLOB}"/><path fill="${alt ? "var(--p-accent)" : "var(--blob)"}" transform="translate(-9 -8) scale(0.93)" d="${BLOB}"/><ellipse fill="var(--hl)" opacity="${alt ? .3 : .5}" cx="-50" cy="-54" rx="20" ry="12" transform="rotate(-35 -50 -54)"/><g style="color:var(--blob-ink)" stroke-width="4" transform="translate(-47.5 -55.6) scale(1.979)">${FACES[face]}</g>`;
  const blob = (size, face) => `<svg width="${size}" height="${size}" viewBox="-115 -115 230 230" aria-hidden="true"><g class="bob">${body(face)}</g></svg>`;
  const blobAt = (x, y, r, face, alt) => `<g transform="translate(${x} ${y}) scale(${r / 100})">${body(face, alt)}</g>`;
  const tw = (x, y, s, f = "var(--hl)") => `<path fill="${f}" d="M${x} ${y-s}l${s*.24} ${s*.76} ${s*.76} ${s*.24}-${s*.76} ${s*.24}-${s*.24} ${s*.76}-${s*.24}-${s*.76}-${s*.76}-${s*.24} ${s*.76}-${s*.24}z"/>`;
  // props, drawn in a 200-unit tile, top right area
  const P = {
    bolt: `<path d="M150 46 L122 100 h22 l-10 46 34 -60 h-22 z" fill="var(--sun)" stroke="var(--hl)" stroke-width="5" stroke-linejoin="round"/>`,
    fire: `<path d="M150 58c14 18 24 30 24 46a24 24 0 0 1-48 0c0-12 8-20 12-28 4 10 8 12 12 12 0-10-4-20 0-30z" fill="var(--sun)"/><path d="M128 132h44M132 140l36-14M132 126l36 14" stroke="var(--hl)" stroke-width="7" stroke-linecap="round"/>`,
    chat: `<rect x="114" y="40" width="68" height="48" rx="16" fill="var(--hl)"/><path d="M130 86l-6 16 18-14z" fill="var(--hl)"/><circle cx="134" cy="64" r="5" fill="var(--bloom)"/><circle cx="148" cy="64" r="5" fill="var(--bloom)"/><circle cx="162" cy="64" r="5" fill="var(--bloom)"/>`,
    waves: `<path d="M140 70q14 24 0 48M156 58q22 36 0 72M172 46q30 48 0 96" stroke="var(--hl)" stroke-width="8" fill="none" stroke-linecap="round"/>`,
    pause: `<rect x="130" y="54" width="15" height="50" rx="6" fill="var(--hl)"/><rect x="153" y="54" width="15" height="50" rx="6" fill="var(--hl)"/>`,
    target: `<circle cx="150" cy="70" r="30" fill="var(--hl)"/><circle cx="150" cy="70" r="19" fill="var(--coral)"/><circle cx="150" cy="70" r="8" fill="var(--hl)"/>`,
    cal: `<rect x="120" y="42" width="60" height="56" rx="10" fill="var(--hl)"/><rect x="120" y="42" width="60" height="16" rx="8" fill="var(--coral)"/><text x="150" y="91" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="28" fill="var(--coral)">14</text>`,
    glass: `<path d="M136 46h32l-4 34a12 12 0 0 1-24 0z" fill="var(--hl)"/><rect x="149" y="92" width="6" height="26" fill="var(--hl)"/><rect x="138" y="116" width="28" height="6" rx="3" fill="var(--hl)"/><path d="M140 58h24l-2 20a10 10 0 0 1-20 0z" fill="var(--sun)"/>`,
    door: `<rect x="128" y="40" width="46" height="74" rx="8" fill="var(--hl)"/><circle cx="164" cy="80" r="4" fill="var(--plum)"/>`,
    star: `<path d="M150 40l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3z" fill="var(--sun)"/>`,
    ear: `<path d="M134 96c0-34 44-40 44-8 0 18-16 18-16 32 0 10-14 12-18 4" stroke="var(--hl)" stroke-width="9" fill="none" stroke-linecap="round"/>`,
    q: `<circle cx="150" cy="68" r="30" fill="var(--hl)"/><text x="150" y="82" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="40" fill="var(--coral)">?</text>`
  };
  const tile = (size, ground, prop, face, tilt = -4, extra = "") => `<svg viewBox="0 0 200 200" width="${size}" height="${size}" aria-hidden="true"><g transform="rotate(${tilt} 100 100)"><rect x="14" y="14" width="172" height="172" rx="34" fill="${ground}"/><circle cx="160" cy="36" r="54" fill="var(--hl)" opacity=".16"/></g>${P[prop]}${extra}${blobAt(88, 130, 40, face)}${tw(42, 48, 10)}</svg>`;
  const scene = (w, h, ground, prop, face) => `<svg viewBox="0 0 200 120" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="120" fill="${ground}"/><circle cx="170" cy="10" r="50" fill="var(--hl)" opacity=".15"/><g transform="translate(10 -16)">${P[prop]}</g>${blobAt(70, 82, 34, face)}${tw(26, 26, 8)}</svg>`;
  const I = {
    home: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>`,
    mic: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>`,
    book: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>`,
    me: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>`,
    check: `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    play: `<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
    flag: `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>`,
    dot: `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>`,
    gear: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>`,
    clock: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>`,
    mic2: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/></svg>`,
    spark: `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>`,
    fire: `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2c3 4 6 7 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-2-1-5 0-7z"/></svg>`,
    lock: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`
  };
  const status = `<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
  const tabs = on => `<nav class="tabs">${[["home", "Today"], ["mic", "Practice"], ["book", "Courses"], ["me", "Me"]].map(([k, l]) => `<div class="${l === on ? "on" : ""}"><i>${I[k]}</i>${l}</div>`).join("")}</nav>`;

  // ---------- 1. Practice ----------
  const practice = () => `${status}<div class="pad">
    <div class="h"><h3 class="round">Practice</h3>${blob(46, "ready")}</div>
    <div class="card quick">
      <div style="width:96px;flex:none">${tile(96, "color-mix(in srgb,var(--sky) 70%,#fff)", "bolt", "wow", 4)}</div>
      <div class="tx"><span class="lab">Quick start · 1–2 min</span><span class="t round">Rapid Fire: a surprise question</span>
      <button class="chunky sm" type="button" style="align-self:flex-start;margin-top:4px;background:#fff;color:var(--sky)!important;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)">Go</button></div>
    </div>
    <div class="sec"><h4 class="round">What do you want to work on?</h4></div>
    <div class="jobs">
      ${[["Speak on the spot", "5 ways", "var(--sun)", "bolt", "ready"], ["Tell stories", "8 ways", "var(--coral)", "fire", "happy"], ["Conversations", "Talk with someone and 7 units", "var(--bloom)", "chat", "ready"], ["Your voice", "Warm‑up, pitch, pausing…", "var(--leaf)", "waves", "sing"]]
        .map(([t, s, g, pr, f], i) => `<div class="card job"><div class="art" style="background:${g}">${scene("100%", 96, g, pr, f)}</div><b class="round">${t}</b><small>${s}</small></div>`).join("")}
    </div>
    <div class="sec"><h4 class="round">Role play</h4><a href="#">All 9</a></div>
    <div class="hscroll">
      ${[["Meeting someone new", "Small talk", "var(--plum)", "chat"], ["The tough question", "At work", "var(--coral)", "q"], ["Raise a glass", "Toasts", "var(--sun)", "glass"], ["Really listening", "Listening", "var(--sky)", "ear"]]
        .map(([t, s, g, pr]) => `<div class="card pack"><div class="art" style="background:${g}">${scene(130, 84, g, pr, "ready")}</div><b class="round">${t}</b><small>${s}</small></div>`).join("")}
    </div>
    <div class="card challenge"><span class="check" aria-hidden="true"></span><div><span class="lab">Off the page this week</span><div style="font-weight:700">Speak first in a meeting or group, even for one sentence.</div></div></div>
  </div>${tabs("Practice")}`;

  // ---------- 2. Courses ----------
  const COURSES = [["Stop freezing", "6 lessons", "var(--sky)", "bolt", "wow"], ["Explain it simply", "6 lessons", "var(--sun)", "target", "happy"], ["Ready by the day", "6 lessons", "var(--coral)", "cal", "ready"], ["Stories that land", "6 lessons", "var(--plum)", "fire", "happy"], ["Beyond “good, you?”", "6 lessons", "var(--bloom)", "chat", "ready"], ["A voice they lean in for", "7 lessons", "var(--leaf)", "waves", "sing"]];
  const courses = () => `${status}<div class="pad">
    <div class="h"><h3 class="round">Courses</h3></div>
    <div class="card cont">
      <span class="lab">Keep going</span>
      <div class="row">${tile(84, "var(--sky)", "bolt", "wow", -4)}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><b class="round" style="font-size:19px;line-height:1.1">Stop freezing</b><span style="font-weight:700;font-size:13.5px;color:var(--p-muted)">Next: Lesson 2, Answer first</span><div class="pbar"><i style="width:22%"></i></div></div></div>
      <button class="chunky" type="button">Continue</button>
    </div>
    <div class="sec"><h4 class="round">For you</h4><a href="#">All 12</a></div>
    <div class="cgrid">${COURSES.slice(1).map(([t, s, g, pr, f], i) => `<div class="card ctile">${tile(118, g, pr, f, i % 2 ? 4 : -4)}<b class="round">${t}</b><small>${s}</small></div>`).join("")}</div>
    <div class="sec"><h4 class="round">Quick reads</h4><a href="#">All 17 sets</a></div>
    <div class="reads">${[["Nerves and presence", "7 cards · 1 min each", "var(--plum)", "spark"], ["Conversation", "10 cards", "var(--bloom)", "mic2"], ["Your voice", "9 cards", "var(--leaf)", "clock"]].map(([t, s, c, ic]) => `<div class="card read"><div class="ic" style="background:${c}">${I[ic]}</div><div><b>${t}</b><small>${s}</small></div></div>`).join("")}</div>
  </div>${tabs("Courses")}`;

  // ---------- 3. Course path ----------
  const LESSONS = [["Pause, don’t fill", "done"], ["Answer first", "now"], ["Three beats", "next"], ["End on purpose", "next"], ["Go back to your point", "next"], ["Two in a row", "next"]];
  const XS = [30, 70, 46, 26, 46, 64];
  const coursePath = () => `${status}
    <div style="display:flex;align-items:center;gap:10px;padding:0 16px 8px"><span style="font-size:24px;color:var(--p-muted)" aria-hidden="true">‹</span><span class="lab">Courses</span></div>
    <div class="band"><div><span class="lab">Course · lesson 2 of 6</span><b>Stop freezing</b></div><div class="guide" aria-label="Course guide">${I.book}</div></div>
    <div class="path">
      <svg width="100%" height="640" viewBox="0 0 340 640" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="${XS.map((x, i) => `${i ? "L" : "M"}${x * 3.4} ${60 + i * 100}`).join(" ")}" stroke="var(--path-off)" stroke-width="10" stroke-dasharray="2 16" stroke-linecap="round" fill="none"/></svg>
      <div class="startpop" style="left:${XS[1]}%;top:82px">Start</div>
      ${LESSONS.map(([n, s], i) => `<div class="node ${s}" style="left:${XS[i]}%;top:${30 + i * 100}px"><div class="disc">${s === "done" ? I.check : s === "now" ? I.play : i === 5 ? I.flag : `<b class="round" style="font-size:22px">${i + 1}</b>`}</div><span class="nm">${n}</span></div>`).join("")}
      <div style="position:absolute;left:66%;top:236px">${blob(84, "wonder")}</div>
      <div style="position:absolute;left:4%;top:548px;width:128px"><div class="bubble" style="font-size:13px">Every lesson is open. Skip ahead any time.</div></div>
    </div>`;

  // ---------- 4. Recording ----------
  const bars = Array.from({length: 5}, (_, i) => `<rect class="lvl" style="animation-delay:${i * .13}s" x="${i * 9}" y="0" width="6" height="34" rx="3" fill="var(--p-accent)"/>`).join("");
  const recording = () => `${status}
    <div class="rtop"><button class="x" type="button" aria-label="Stop and leave">✕</button><div class="pbar"><i style="width:10%"></i></div></div>
    <div class="rq"><span class="lab" style="color:var(--sun)">Rapid Fire · step 1 of 3</span><h2 class="round">What’s a small thing that made your week?</h2></div>
    <div class="listen">
      <svg class="rings" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><circle class="ring" cx="120" cy="120" r="80" fill="none" stroke="var(--blob)" stroke-width="4"/><circle class="ring" style="animation-delay:1.1s" cx="120" cy="120" r="80" fill="none" stroke="var(--blob)" stroke-width="4"/></svg>
      ${blob(150, "sing")}
    </div>
    <div class="clock"><b>0:47</b><span class="light"><i></i><i class="g"></i><i></i>green at 1:00</span><svg width="44" height="34" viewBox="0 0 44 34" aria-label="Your level">${bars}</svg></div>
    <div class="card live">I made pancakes, called my sister, and just read for hours. <strong>It reminded me that doing nothing is sometimes…</strong></div>
    <span class="cuechip">Cue: Pause, don’t fill</span>
    <div class="stopdock"><button class="side" type="button">Start over</button><button class="stop" type="button" aria-label="Done"><span></span></button><button class="side" type="button">Hide words</button></div>`;

  // ---------- 5. Me ----------
  const DAYS = ["M","T","W","T","F","S","S"];
  const me = () => `${status}<div class="pad">
    <div class="h"><div class="who">${blob(64, "happy")}<div><b>You, so far</b><small>Practising since 14 October</small></div></div><button type="button" aria-label="Settings" style="background:none;border:0;color:var(--p-muted)">${I.gear}</button></div>
    <div class="card days">${DAYS.map((d, i) => `<span class="${[0, 1, 2, 4].includes(i) ? "d" : ""}"><b>${[0, 1, 2, 4].includes(i) ? "✓" : ""}</b>${d}</span>`).join("")}<div style="font-weight:800;font-size:13px;text-align:right;line-height:1.2">4 of the<br>last 7 days</div></div>
    <div class="card tn">
      <span class="lab">Then and now · Rapid Fire</span>
      <div class="cols"><div class="col"><small>Day 1</small><b>6.1</b><small>pause words a minute</small></div><span style="font-size:22px;color:var(--p-muted)">→</span><div class="col now"><small>This week</small><b>2.3</b><small>pause words a minute</small></div></div>
      <div class="playrow"><button class="playbtn" type="button"><i></i>Hear day 1</button><button class="playbtn" type="button"><i></i>Hear now</button></div>
    </div>
    <div class="stats">${[["23", "takes", "var(--sky)", "mic2"], ["41 min", "spoken", "var(--leaf)", "clock"], ["6", "stories told", "var(--coral)", "fire"], ["5 days", "best run", "var(--sun)", "spark"]].map(([b, s, c, ic]) => `<div class="card stat"><div class="ic" style="background:${c}">${I[ic]}</div><div><b>${b}</b><small>${s}</small></div></div>`).join("")}</div>
    <div class="sec"><h4 class="round">Your takes</h4><a href="#">See all</a></div>
    <div class="card read"><div class="ic" style="background:var(--p-accent)">${I.play}</div><div style="flex:1"><b>Rapid Fire · last night</b><small>1:24 · 2 pause words · ★ kept</small></div></div>
    <div class="sec"><h4 class="round">Settings</h4></div>
    <div class="card settings">${[["What you’re working on", "Thinking on my feet"], ["Reminder", "8:30 pm"], ["Look", "System"], ["Your data", "On this phone"], ["Coach", "<em>Advanced</em>"]].map(([t, v]) => `<div class="set">${t}<span>${v} ›</span></div>`).join("")}</div>
  </div>${tabs("Me")}`;

  const SCREENS = [
    ["Practice", "One quick start up top, then four big jobs with pictures instead of a long list. Role‑play packs (your Scenes and Talk with someone) get their own row, Wellspoken‑style.", practice],
    ["Courses", "Courses and Learn become one tab. “Keep going” leads; Learn’s card sets sit below as Quick reads.", courses],
    ["A course’s path", "Duolingo’s path, made calmer: every lesson is open (no locks), each node says its name, and the blob keeps you company.", coursePath],
    ["Recording", "Focus mode: no tabs. The blob sings along while you talk, the timing light and level sit under it, and the cue stays in view.", recording],
    ["Me", "Progress and settings together (your Headspace pick). Leads with then‑and‑now you can hear, never zeros: a new user would see their first take here instead.", me]
  ];
  const phones = document.getElementById("phones");
  phones.innerHTML = SCREENS.map(([t, d], i) => `<div class="pcol"><div class="cap"><h2>${t}</h2><p>${d}</p></div><div class="p" data-i="${i}"></div></div>`).join("");
  let mode = "light"; try { if (matchMedia("(prefers-color-scheme: dark)").matches) mode = "dark"; } catch (e) {}
  try { mode = localStorage.getItem("vl-bscreens-mode") || mode; } catch (e) {}
  function render() {
    phones.querySelectorAll(".p").forEach(p => { p.dataset.m = mode; p.innerHTML = `<div class="scr">${SCREENS[+p.dataset.i][2]()}</div>`; });
    document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
    try { localStorage.setItem("vl-bscreens-mode", mode); } catch (e) {}
  }
  document.getElementById("modes").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { mode = b.dataset.m; render(); } });
  render();
})();
</script>

</body></html>
