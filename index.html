<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <title>Table Topics - Speech Practice</title>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="mic-2" class="logo-icon"></i>
                    <span>Table Topics</span>
                </div>
                <div class="header-actions">
                    <button id="history-btn" class="btn btn-ghost" title="View Progress">
                        <i data-lucide="bar-chart-2"></i>
                        <span class="btn-label">Progress</span>
                    </button>
                    <button id="settings" class="btn btn-ghost" title="Settings">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Game Card -->
            <div class="card game-card background" id="game-card">
                <div class="card-inner">
                    <!-- Main Display -->
                    <div id="main-display" class="main-display">
                        <h1 class="display-title">Ready to Practice?</h1>
                        <p class="display-subtitle">Improve your impromptu speaking skills</p>
                    </div>

                    <!-- Timer Display -->
                    <div id="timer" class="timer-display"></div>

                    <!-- Countdown -->
                    <div id="countdown" class="countdown-display"></div>

                    <!-- Word of the Day -->
                    <div id="WOD" class="word-of-day"></div>

                    <!-- Recording Indicator -->
                    <div id="recording-indicator" class="recording-indicator">
                        <span class="recording-dot"></span>
                        <span class="recording-text">Recording</span>
                    </div>

                    <!-- Game Controls -->
                    <div class="game-controls" id="game-controls">
                        <button id="pause" class="btn btn-control" title="Pause">
                            <i data-lucide="pause"></i>
                        </button>
                        <button id="stop" class="btn btn-control btn-stop" title="Stop">
                            <i data-lucide="square"></i>
                        </button>
                        <button id="resume" class="btn btn-control" title="Resume">
                            <i data-lucide="play"></i>
                        </button>
                        <button id="reset" class="btn btn-control" title="Reset">
                            <i data-lucide="rotate-ccw"></i>
                        </button>
                        <button id="record" class="btn btn-control btn-record" title="Toggle Recording">
                            <i data-lucide="mic"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mode Selector -->
            <div id="mode-selector" class="mode-selector">
                <!-- Populated by practiceModes.js -->
            </div>

            <!-- Play Button -->
            <button id="play" class="btn btn-primary btn-large">
                <i data-lucide="play"></i>
                Start Practice
            </button>

            <!-- Real-Time Coach Toggle -->
            <div class="coach-toggle" style="margin-top: 0.75rem; text-align: center;">
                <label style="display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: hsl(var(--muted-foreground)); cursor: pointer;">
                    <input type="checkbox" id="coach-toggle" checked style="accent-color: hsl(var(--primary));">
                    <span>Enable Real-Time Speech Coach</span>
                </label>
            </div>

            <!-- Settings Card -->
            <div class="card settings-card" id="settings-card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i data-lucide="settings"></i>
                        Settings
                    </h2>
                    <button class="btn btn-ghost btn-icon" onclick="closeSettings()">
                        <i data-lucide="x"></i>
                    </button>
                </div>

                <div class="settings-grid">
                    <div class="settings-section">
                        <h3 class="section-title">Content</h3>
                        <div class="button-group">
                            <button class="btn btn-outline" onclick="showQuestionsArray()">
                                <i data-lucide="message-circle"></i>
                                View Questions
                            </button>
                            <button class="btn btn-outline" onclick="addNewQuestionState()">
                                <i data-lucide="plus"></i>
                                Add Question
                            </button>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-outline" onclick="showWODArray()">
                                <i data-lucide="book-open"></i>
                                View Words
                            </button>
                            <button class="btn btn-outline" onclick="addNewWODState()">
                                <i data-lucide="plus"></i>
                                Add Word
                            </button>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3 class="section-title">App</h3>
                        <div class="button-group">
                            <button class="btn btn-outline" onclick="showRulesState()">
                                <i data-lucide="help-circle"></i>
                                How to Play
                            </button>
                            <button class="btn btn-outline btn-warning" onclick="showApiKeySettings()">
                                <i data-lucide="key"></i>
                                API Key
                            </button>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-outline" onclick="exportHistory()">
                                <i data-lucide="download"></i>
                                Export Data
                            </button>
                            <button class="btn btn-outline btn-danger" onclick="clearStorage()">
                                <i data-lucide="trash-2"></i>
                                Clear Data
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Display Card (for lists/forms) -->
            <div class="card display-card" id="display-card">
                <div class="card-header">
                    <h2 class="card-title" id="display-card-title">Content</h2>
                    <button class="btn btn-ghost btn-icon" id="close-list-BTN" onclick="closeDisplayCard()">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="card-body">
                    <ul id="edit-question-list" class="item-list"></ul>
                </div>
            </div>

            <!-- Analysis Results Card -->
            <div id="analysis-results-card" class="card analysis-card">
                <!-- Content populated by speechAnalysis.js -->
            </div>

            <!-- History Card -->
            <div id="history-card" class="card history-card">
                <!-- Content populated by sessionHistory.js -->
            </div>
        </main>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="dataManager.js"></script>
    <script src="voiceRecorder.js"></script>
    <script src="speechAnalysis.js"></script>
    <script src="sessionHistory.js"></script>
    <script src="practiceModes.js"></script>
    <script src="realtimeCoach.js"></script>
    <script src="audioAnalysis.js"></script>
    <script src="gameManager.js"></script>
    <script src="stateManager.js"></script>
    <script src="app.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
